# TRACE - source→target traceability matrix.
# Contract: every live SOURCE file appears EXACTLY ONCE; excluded files are listed with
# status `excluded` and a reason. CI checks completeness against the SOURCE tree so no
# file is silently dropped. Update statuses at sprint end (/port-sprint-end).
#
# status: unmapped     - live, not yet started
#         in-progress  - being ported by <workstream>
#         gated        - ported AND acceptance gate passed AND independent fidelity
#                        review clean (gate + review evidence and tag recorded).
#                        The gate field must cite tier R1 or higher: R0 evidence can
#                        never gate an entry. gated is a TECHNICAL status; phase/
#                        milestone acceptance is the human's SIGNOFF.md.
#         excluded     - outside the pinned configuration (reason required)

meta:
  source_root: source/
  target_root: target/
  source_commit: "<hash - must match charter §2>"

files:
  - source: <path/relative/to/source_root.F90>
    target: [<path/relative/to/target_root.c>]
    status: unmapped
    workstream: main
    gate: null        # e.g., R1 evidence: docs/evidence/<...> (tier R1+, never R0)
    review: null      # fidelity review report: docs/evidence/<date>-review-<module>/
    author_sessions: []   # every sprint that wrote this translation
    reviewer_session: null  # must not appear in author_sessions
    tag: null         # git tag of the milestone that gated it
    notes: ""
    # optional, for files mixing routine classes (pure / wide-footprint / seam):
    # symbols:
    #   - name: <routine>
    #     class: pure | wide | seam
    #     verification: <unit test path | replay fixture path | ladder tier>
    #     status: unmapped | in-progress | gated
  - source: <unused/module.F90>
    target: []
    status: excluded
    workstream: null
    gate: null
    tag: null
    notes: "not exercised by pinned configuration (<how determined>)"

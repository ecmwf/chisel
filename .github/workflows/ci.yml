# CI: runs whatever proofs and conformance checks exist. Intentionally thin at
# bootstrap - each Phase-1 deliverable adds its script here. The principle: a rule
# depends on being remembered; a check does not.
name: ci
on:
  push:
  pull_request:

# Read-only token: CI checks and reports, it never writes to the repository.
permissions:
  contents: read

jobs:
  conformance-and-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the anchor verifier resolves anchors against the
          # pinned SOURCE ref (a tag / the local import commit), absent from a shallow clone.
          fetch-depth: 0
      - name: Fetch claim refs (only the advanced multi-operator path uses pushed refs/claims/*)
        # The DEFAULT claim store is the local, gitignored port/claims/ - absent in CI, so the
        # no-arg check-claims skips. This fetch is a harmless no-op unless a port adopts pushed-ref
        # claims and runs check-claims --from-refs in CI; then the refs must be present.
        run: git fetch origin "+refs/claims/*:refs/claims/*" || true
      - name: Authorize the linked product checkout (private product; no-op without the secret)
        # A PRIVATE product is unreachable from CI by default: the workflow token reaches only
        # THIS repo, so the next step's clone fails and product-facing checks report UNRELIABLE
        # (red). Provide a READ-ONLY token for the product as the secret PRODUCT_RO_TOKEN and this
        # rewrites the product's git URL (SSH- or HTTPS-form alike) to use it. With NO secret set
        # this is a deliberate no-op: the product checkout stays FAIL-CLOSED (wired-but-unreachable
        # is UNRELIABLE, never a silent green), so a misconfigured CI cannot pass with the product
        # unverified. Creating the token: tools/new-product.sh prints the step; see
        # references/two-repo-architecture.md.
        env:
          PRODUCT_RO_TOKEN: ${{ secrets.PRODUCT_RO_TOKEN }}
        run: |
          if [ -z "${PRODUCT_RO_TOKEN:-}" ]; then
            echo "no PRODUCT_RO_TOKEN secret - product checkout stays fail-closed if the product is private."
            exit 0
          fi
          # --add on the second value: a plain second 'insteadOf' OVERWRITES the first, leaving
          # only one URL form rewritten. Both forms (SSH and HTTPS) must map through the token.
          git config --global url."https://x-access-token:${PRODUCT_RO_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${PRODUCT_RO_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "product checkout authorized via PRODUCT_RO_TOKEN (read-only)."
      - name: Check out the linked product (two-repo; no-op if unwired)
        run: bash tools/checkout-product.sh
      - name: Install project analysis dependencies (libclang, gfortran; see tools/requirements-ast.txt)
        # Conformance checks that parse C or Fortran use real front ends (libclang, fparser2)
        # rather than text matching, so the parser must exist HERE too - otherwise those checks
        # correctly report UNRELIABLE and CI goes red. A suite green on a dev machine and red on
        # the runner is the usual symptom: the tool was installed in one place only. Installing
        # it is the fix; loosening the checks to tolerate its absence is not.
        # NOTE the two-package subtlety that cost a CI round: the `clang` PyPI package ships the
        # PYTHON BINDINGS ONLY, so `import clang.cindex` succeeds while every parse then fails with
        # "libclang.so: cannot open shared object file". The `libclang` package bundles the native
        # shared library. Install the distro dev package too, so a real .so exists either way.
        # The anchor verifier also runs the clang DRIVER (`clang -print-resource-dir`) to resolve
        # standard headers, so `clang` is installed explicitly rather than assumed from the image.
        # The anchor-verifier case corpus (tools/conformance/seeded-bugs/verify-anchors/) pairs
        # Fortran SOURCE with C TARGET, and its validator compiles both sides, so `gfortran` is
        # installed too; the validator fails, never skips, without it. The anchor value verifier
        # (tools/conformance/lib/anchor_values.py) reads the SOURCE's structure with fparser
        # (tools/requirements-ast.txt) and compiles probes with gfortran and clang.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang libclang-dev python3-clang gfortran || true
          python3 -m pip install --quiet --break-system-packages libclang -r tools/requirements-ast.txt || true
          python3 - <<'PY'
          import clang.cindex as ci
          ci.Index.create()          # fails loudly if the native library is missing
          import fparser             # the Fortran parser the anchor value verifier reads SOURCE with
          print("libclang bindings AND native library OK; fparser OK")
          PY
          clang -print-resource-dir    # fails loudly if the clang driver is missing
          gfortran --version           # fails loudly if gfortran is missing
      - name: Tool regression tests (tools/tests/run.sh)
        # The methodology's own tools (worker provisioning, the sync land guard, product
        # invisibility, the anchor verifier) tested against throwaway fixture repos that each test
        # builds and configures itself - no product checkout and no git identity are needed. After
        # the dependency install: the anchor-verifier test drives the real verifier, which fails
        # (never skips) without libclang and the clang driver, and the case-corpus validator fails
        # without clang and gfortran.
        run: bash tools/tests/run.sh
      - name: Conformance checks (see tools/README.md enforcement status)
        # Parallel runner: independent read-only checks run concurrently, wall-clock collapses to
        # the slowest. Prints a per-check verdict summary and the full output of any non-green check.
        run: bash tools/run-conformance.sh
      - name: CI-eligible proofs
        run: |
          shopt -s nullglob
          # legacy-vocab: a port created before proof / proven may still keep them in tools/gates/
          for s in tools/proofs/ci-*.sh tools/gates/ci-*.sh; do echo "== $s"; bash "$s"; done  # legacy-vocab
        # Convention: only proofs prefixed `ci-` run here (fast, no cluster needed).
        # Long-running tiers (R2/R5) run on the compute system; their evidence lands
        # in docs/evidence/ and is linked from the plan at sign-off.
      - name: CI-eligible scoping checks
        run: |
          shopt -s nullglob
          for s in tools/scoping/ci-*.sh; do echo "== $s"; bash "$s"; done
        # Same `ci-` convention as proofs/: a project's build-free scoping/TRACE checks
        # (e.g. completeness, TRACE-vs-charter consistency) are named ci-*.sh to be run
        # here. Arg-taking scripts (live-subset/scope generators) and non-shell views
        # stay unprefixed so this glob skips them.

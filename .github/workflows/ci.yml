# CI: the conformance checks and proofs on every change, and the tool tests the change can affect.
# The principle: a rule depends on being remembered; a check does not. tools/tests/covers.json says
# which files each tool test reads, and tools/tests/select_tests.py picks the tests a diff touches.
name: ci
on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI checks and reports, it never writes to the repository.
permissions:
  contents: read

# A new push to a pull request cancels the run of the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance-and-proofs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Full history + tags: the anchor verifier resolves anchors against the pinned SOURCE ref,
          # and the test selection compares with the base of the change.
          fetch-depth: 0
          # No token left in .git/config for later steps: the one fetch below that needs it gets it.
          persist-credentials: false
      - name: Install uv, with the environment active for every later step
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          activate-environment: true
      - name: Install the tools' Python packages (uv.lock; fails if it disagrees with pyproject.toml)
        run: uv sync --locked
      - name: Fetch claim refs (only the advanced multi-operator path uses pushed refs/claims/*)
        # The workflow token reaches this fetch only, through git's environment configuration.
        env:
          TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git fetch origin "+refs/claims/*:refs/claims/*" || true
      - name: Check out the linked product (two-repo; no-op if unwired)
        # A PRIVATE product is unreachable with the workflow token alone, so product-facing checks
        # report UNRELIABLE (red). A READ-ONLY token for it as the secret PRODUCT_RO_TOKEN makes it
        # reachable; with no secret the product stays fail-closed. The token reaches this step only,
        # through git's environment configuration, never the runner's global git config.
        # See references/two-repo-architecture.md.
        env:
          PRODUCT_RO_TOKEN: ${{ secrets.PRODUCT_RO_TOKEN }}
        run: |
          if [ -n "${PRODUCT_RO_TOKEN:-}" ]; then
            auth="https://x-access-token:${PRODUCT_RO_TOKEN}@github.com/"
            export GIT_CONFIG_COUNT=2
            export GIT_CONFIG_KEY_0="url.$auth.insteadOf" GIT_CONFIG_VALUE_0="git@github.com:"
            export GIT_CONFIG_KEY_1="url.$auth.insteadOf" GIT_CONFIG_VALUE_1="https://github.com/"
            echo "product checkout authorized via PRODUCT_RO_TOKEN (read-only), for this step only."
          else
            echo "no PRODUCT_RO_TOKEN secret - product checkout stays fail-closed if the product is private."
          fi
          bash tools/checkout-product.sh
      - name: Select the tool tests this change can affect
        id: sel
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then base="origin/$GITHUB_BASE_REF"; else base="$BEFORE"; fi
          python3 tools/tests/select_tests.py ${base:+--base "$base"} --github-output
      - name: Decide whether the analysis toolchain is needed
        id: need
        # A selected test that parses or compiles C or Fortran needs it, and so does a port with a
        # product or its own CI proofs and scoping checks (their checks read and build the code).
        env:
          SELECTED: ${{ steps.sel.outputs.toolchain }}
        run: |
          need="$SELECTED"
          shopt -s nullglob
          proofs=(tools/proofs/ci-*.sh tools/scoping/ci-*.sh)
          if [ -f port/product.yaml ] || [ "${#proofs[@]}" -gt 0 ]; then need=true; fi
          echo "toolchain=$need" >>"$GITHUB_OUTPUT"
          echo "analysis toolchain needed: $need"
      - name: Install the analysis toolchain (clang, clang-tidy, gfortran)
        if: steps.need.outputs.toolchain == 'true'
        # The runner image ships clang, clang-tidy and gfortran: only what is missing is installed.
        # libclang and fparser come from uv.lock (the `libclang` wheel brings libclang's native
        # library with its Python bindings). The checks fail (UNRELIABLE), never skip, without
        # these, so the step verifies each one.
        run: |
          missing=()
          for tool in clang clang-tidy gfortran; do command -v "$tool" >/dev/null || missing+=("$tool"); done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "installing: ${missing[*]}"
            sudo apt-get update -qq && sudo apt-get install -y -qq "${missing[@]}"
          fi
          # clang's sanitizer runtimes (MemorySanitizer) come with a separate package on some images.
          if ! echo 'int main(void){return 0;}' | clang -x c -fsanitize=memory - -o /tmp/msan-probe 2>/dev/null; then
            v="$(clang -dumpversion | cut -d. -f1)"
            echo "installing: libclang-rt-$v-dev"
            sudo apt-get update -qq && sudo apt-get install -y -qq "libclang-rt-$v-dev"
          fi
          python3 - <<'PY'
          import clang.cindex as ci
          ci.Index.create()          # fails loudly if the native library is missing
          import fparser
          print("libclang bindings and native library OK; fparser OK")
          PY
          clang --version | head -1
          clang -print-resource-dir
          clang-tidy --version | grep -i version
          gfortran --version | head -1
      - name: Tool tests this change can affect (tools/tests/run.sh)
        if: steps.sel.outputs.count != '0' && steps.sel.outputs.count != ''
        env:
          TESTS: ${{ steps.sel.outputs.tests }}
        run: bash tools/tests/run.sh $TESTS
      - name: Conformance checks (see tools/README.md enforcement status)
        # Parallel runner: prints a per-check verdict summary and the output of any non-green check.
        run: bash tools/run-conformance.sh
      - name: CI-eligible proofs
        # Only proofs prefixed `ci-` run here (fast, no cluster). Long-running tiers (R2/R5) run on
        # the compute system; their evidence lands in docs/evidence/.
        run: |
          shopt -s nullglob
          # legacy-vocab: a port created before proof / proven may still keep them in tools/gates/
          for s in tools/proofs/ci-*.sh tools/gates/ci-*.sh; do echo "== $s"; bash "$s"; done  # legacy-vocab
      - name: CI-eligible scoping checks
        # Same `ci-` convention as proofs/: build-free scoping/TRACE checks named ci-*.sh.
        run: |
          shopt -s nullglob
          for s in tools/scoping/ci-*.sh; do echo "== $s"; bash "$s"; done

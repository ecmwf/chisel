description: an anchor alone on the line above a formatter-wrapped declaration that has no anchor of its own
source: {file: source.F90, line: 5, name: LIMIT}
target: {file: target.c, line: 4, name: limit}
regimes: [dp, sp]
expect: invalid-anchor
why: the declaration starts on the type line right below the comment, so the comment is neither below na nor inside limit and binds to nothing; a checker that starts the declaration at its name line takes the comment as below na, and one that lets a comment cover the next declaration takes it for limit

# Phase-1 plan meta: port/phase1/_meta.yaml, one per port. It holds the plan-wide values and the
# stable unit order that generate_phase1_plan.py needs; it is not a unit fragment, and the
# generator skips it. To add a unit, add its id to `ordering` and create port/phase1/units/<id>.yaml:
# the generator stops unless the two sets are the same.

schema_version: 1
# F0: true only after the phase0-signed tag (SOURCE and configuration pinned, live subset fixed,
# canonical reference run archived). The driver checks the tag itself.
source_signed: false
ordering:
  - <unit-id-of-the-layer-0-harness>   # proven first; everything else compares through it
  # - <layer-1-unit-id>                # the fan-out pool, in a stable order

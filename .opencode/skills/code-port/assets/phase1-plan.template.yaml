# port/phase1-plan.yaml - the Phase-1 TOOL-BUILD plan the driver reads.
#
# Scaffold this automatically with tools/coordination/scaffold_phase1_plan.py (it writes the full
# canonical representative unit set, valid by construction); or hand-adapt this template - a schema
# example showing the harness plus one commented Layer-1 unit.
#
# Phase 1 builds the comparison infrastructure (the differential harness, the proofs, the conformance
# checks, the dependency-map extractor, the six diff-tool classes) BEFORE any translation; at scale
# that build parallelizes on the same claims/fragments/integrator substrate. This plan is to the
# Phase-1 driver (tools/coordination/phase1_drive.py) what the dependency map is to autodrive.py:
# the unit list it derives the next action from. See references/parallel-phase-1.md (F0-F4) and
# references/auto-mode.md ("Phase 1: the tool-build driver").
#
# The driver is READ-ONLY, deterministic, and fail-CLOSED. Unlike Phase 2, no conformance check
# validates this plan's self-reported flags, so the driver SELF-VALIDATES: `accepted`/`integrated`
# are trusted ONLY when backed by complete, committed F3 evidence + an independent clean review; a
# forged or inconsistent flag becomes triage, never a false done/integrate. It writes nothing and
# certifies nothing - the orchestrator executes within the charter's autonomy level/scope/budget and
# commits each piece's evidence to git as it goes (no separate ledger; the action vocabulary is
# identical to Phase 2).

schema_version: 1

# F0 PREREQUISITE. Do not fan out Phase-1 tooling over an unsigned Phase 0 (it would build against a
# moving target). The driver HALTS until this is true: set it only after the phase0-signed tag - the
# SOURCE pinned, the configuration pinned, the live subset fixed, the canonical reference run archived.
source_signed: false

# One unit = one tooling component (one small module per tool; resist merging them).
units:
  - id: harness                 # the differential harness - everything else compares THROUGH it
    layer: 0                     # 0 = the near-serial bootstrap, proven FIRST; >=1 = the fan-out pool
    kind: harness                # harness | diff-tool | proof | check | depmap | conventions
    depends_on: []               # unit ids that must be INTEGRATED first (producer-before-consumer)
    provides_contract: null      # optional "name@version" a consumer depends on, e.g. dump-format@1 (no two units provide the same name)
    consumes_contracts: []       # optional ["name@version", ...]; the producer must be integrated first
    author_id: null              # the worker's identity - the ORCHESTRATOR records it from the worker's
                                 # subagent-result ses_ id (a dispatched subagent cannot see its own session
                                 # id, so the worker never sets this; null from the worker is expected)
    reviewer_id: null            # the INDEPENDENT reviewer - the orchestrator records it from the
                                 # reviewer's ses_ id; MUST differ from author_id before mark-proven
    # F3 acceptance records - broader than a seed, because every later wave TRUSTS this tooling. Each
    # (except readme_row) is a COMMITTED file under docs/evidence/phase1/<id>/; the driver treats a
    # key as satisfied only when that path is git-tracked and exists (an absolute/escaping/untracked
    # path, or an unrelated existing file, does NOT count). Required keys come from `kind`
    # (harness/diff-tool need inertness; proof/check/depmap need non_vacuity; all need
    # seeded/source_demo/review/readme_row). `extra_evidence: [k, ...]` ADDS keys; it can NEVER remove
    # a baseline requirement.
    evidence:
      seeded: null               # F3.1 docs/evidence/phase1/harness/seed.md  - the detector fires (red->green)
      source_demo: null          # F3.2 docs/evidence/phase1/harness/source-run.md - correct on the REAL source
      inertness: null            # F3.3 (harness/diff-tool) docs/evidence/phase1/harness/inertness.md - byte-inert when off
      review: null               # F3.4 docs/evidence/phase1/harness/review.md - INDEPENDENT review; verdict must be clean
      readme_row: false          # F3.5 - tools/README enforcement-table row set to ENFORCED (true once done)
    accepted: false              # the orchestrator records this AFTER the independent review is clean (mark-proven)
    integrated: false            # the integrator merged the component into the WORKBENCH (Phase 1 never touches the product)

  # Layer-1 example (uncomment + adapt): a diff tool that consumes the harness dump-format contract,
  # shown with the committed-path evidence form once it is built + independently reviewed.
  # - id: diff-operator
  #   layer: 1
  #   kind: diff-tool
  #   depends_on: [harness]
  #   consumes_contracts: [dump-format@1]   # the harness must provide dump-format@1 and be integrated
  #   author_id: ses_<worker-session>      # the orchestrator records the worker's ses_ id here
  #   reviewer_id: ses_<reviewer-session>  # the reviewer's ses_ id; a DISTINCT session from author_id
  #   evidence:
  #     seeded: docs/evidence/phase1/diff-operator/seed.md
  #     source_demo: docs/evidence/phase1/diff-operator/source-run.md
  #     inertness: docs/evidence/phase1/diff-operator/inertness.md
  #     review: docs/evidence/phase1/diff-operator/review.md
  #     readme_row: true
  #   accepted: false
  #   integrated: false

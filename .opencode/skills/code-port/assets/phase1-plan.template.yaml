# port/phase1-plan.yaml: the Phase-1 tool-build plan that tools/coordination/phase1_drive.py reads.
# scaffold_phase1_plan.py writes the full representative unit set; or adapt this example, the
# harness plus one commented Layer-1 unit. Once unit fragments exist (port/phase1/units/*.yaml,
# phase1-unit-fragment.template.yaml), generate_phase1_plan.py builds this file from them and
# check-phase1-plan.sh drift-checks it. See references/parallel-phase-1.md (F0-F4) and
# references/auto-mode.md ("Phase 1: the tool-build driver").
#
# The driver only reads, and fails closed: it trusts `accepted` and `integrated` only when the
# unit's committed F3 evidence is complete and an independent review of it is clean, so a forged or
# inconsistent flag becomes triage. Ptah-Orchestrator acts on the driver's plan within the
# charter's autodrive settings (section 12) and commits each unit's evidence as it goes.

schema_version: 1

# F0: no Phase-1 fan-out over an unsigned Phase 0. The driver halts until this is true, and
# checks that the phase0-signed tag is an ancestor of HEAD; set it only after that tag exists.
source_signed: false

# One unit = one tooling component (one small module per tool; do not merge them).
units:
  - id: harness                 # the differential harness - everything else compares through it
    layer: 0                    # 0 = the near-serial bootstrap, proven first; 1 or more = the fan-out pool
    kind: harness               # harness | diff-tool | proof | check | depmap | conventions
    depends_on: []              # unit ids that must be integrated first (producer before consumer)
    provides_contract: null     # optional "name@version" a consumer depends on, e.g. dump-format@1
    consumes_contracts: []      # optional ["name@version", ...]; its producer must be integrated first
    author_id: null             # Kha-Worker's ses_ id, recorded by Ptah-Orchestrator from the
                                # subagent result (Kha-Worker cannot see it and leaves it null)
    reviewer_id: null           # port-review's ses_ id, recorded the same way; must differ from
                                # author_id before mark-proven
    reviewed_commit: null       # the work/<id> commit the review covered, recorded with reviewer_id;
                                # integrate_land.sh lands nothing changed after it but this unit's records
    # F3 acceptance records. Each but readme_row is a committed file under
    # docs/evidence/phase1/<id>/; the driver counts a key only when that path is tracked by git and
    # unmodified. Which keys are required follows `kind`: harness and diff-tool need inertness;
    # proof, check and depmap need non_vacuity; every kind needs seeded, source_demo, review and
    # readme_row. `extra_evidence: [key, ...]` adds keys; it never removes one.
    evidence:
      seeded: null              # F3.1 docs/evidence/phase1/harness/seed.md - the detector fires (red, then green)
      source_demo: null         # F3.2 docs/evidence/phase1/harness/source-run.md - correct on the real SOURCE
      inertness: null           # F3.3 docs/evidence/phase1/harness/inertness.md - byte-inert when off
      review: null              # F3.4 docs/evidence/phase1/harness/review.md - independent review, verdict clean
      readme_row: false         # F3.5 - the tool's enforcement row set to ENFORCED (true once done)
    accepted: false             # set by mark-proven after the independent review is clean
    integrated: false           # landed on the workbench by integrate_land.sh (Phase 1 never touches the product)

  # A Layer-1 example (uncomment and adapt): a diff tool that uses the harness's dump-format contract,
  # once built and independently reviewed.
  # - id: diff-operator
  #   layer: 1
  #   kind: diff-tool
  #   depends_on: [harness]
  #   consumes_contracts: [dump-format@1]
  #   author_id: ses_<worker-session>
  #   reviewer_id: ses_<reviewer-session>
  #   reviewed_commit: <the work/diff-operator commit the review covered>
  #   evidence:
  #     seeded: docs/evidence/phase1/diff-operator/seed.md
  #     source_demo: docs/evidence/phase1/diff-operator/source-run.md
  #     inertness: docs/evidence/phase1/diff-operator/inertness.md
  #     review: docs/evidence/phase1/diff-operator/review.md
  #     readme_row: true
  #   accepted: false
  #   integrated: false

# Status fragment: port/status/<trace-id>.yaml, one per work item, written on the item's own
# branch. port/TRACE.yaml is generated from the fragments by tools/coordination/generate_trace.py
# and drift-checked (check-trace-drift.sh), so it is never edited by hand. The port-wide TRACE meta
# is port/status/_meta.yaml (status-meta.template.yaml), which is not a fragment.
#
# check-status-fragments.sh checks every fragment: its keys and values, that reviewer_id differs
# from author_id, that reviewer_session is not in author_sessions, that author_id is the worker
# session its claim records (threads.worker), and that claim.ref is this item's own claim. Lists may
# be written in block or inline form.

# The work-item id is the SOURCE file stem: the dependency-map node, this fragment and the claim all
# use it. Live and dead variants that share a stem are told apart by excluding the dead ones in
# tools/scoping/source-exclude.yaml, never by another id.
id: <trace-id>
source: <source path, relative to source_root>
target: [<target path, relative to target_root>]    # required unless status: excluded

# As in TRACE: unmapped | in-progress | proven | excluded. proven means an R1+ proof passed and an
# independent review came back clean.
status: in-progress

# An owned surface or foundation names its owner; a self-serve leaf names none.
ownership:
  kind: <owned | leaf>
  workstream: <owner, when kind is owned; else null>
  owned_surface: <owned-surface name, when kind is owned; else null>

# Producer before consumer: a consumer is proven against a proven producer (check-contracts.sh).
depends_on: []                 # work-item ids this depends on
provides_contract: null        # "<name>@<version>" when this item owns a shared seam
consumes_contracts: []         # "<name>@<version>" contracts this item is proven against

# Identity. Ptah-Orchestrator records these from the subagent results: a subagent cannot see its
# own session id, so Kha-Worker leaves them null and reports READY FOR INDEPENDENT REVIEW.
# reviewer_id and reviewer_session are required once the item is proven.
author_id: null                # Kha-Worker's ses_ id; equals threads.worker in the claim
author_team: null
author_sessions: []            # every session that wrote this translation
reviewer_id: null              # port-review's ses_ id; never author_id
reviewer_team: null
reviewer_session: null         # never one of author_sessions

# The claim that reserved this item: port/claims/<trace-id>.yaml, or the pushed ref
# refs/claims/<trace-id>.
claim:
  ref: port/claims/<trace-id>.yaml
  claimant: <the claimant in the claim>
  state: <created | active | stale>     # a stale claim waits for the human to triage it

# Where the code is in the product repo.
product:
  branch_commit: null          # on the item's branch
  main_commit: null            # on the product mainline; required once integrated

# Required once proven. integrate_product.sh and integrate_assembly.sh land only proof.commit.
proof:
  tier: null                   # R1 or higher (R0 never proves)
  validation: null             # "transitive" for a declaration-only unit (a type or constant alias,
                               # with no behavior to test on its own): it is validated when a unit
                               # that uses it passes its R1, and the planner parks it instead of
                               # proving it at R0. null for every other unit.
  commit: null                 # the product commit the proof ran against
  evidence: null               # workbench path to the proof logs
review:
  evidence: null               # workbench path to the review report
  targets: []                  # the `target` list when the item was marked proven; review_revalidate.sh
                               # uses it to decide whether a rebase keeps the review valid

integration:
  state: null                  # null | proven | integrated (landed on the product mainline, its own
                               # proof green); any value needs status: proven
  epoch_certificate: null      # the per-wave cross-piece integration-epoch certificate, where one applies

workbench_manifest: null       # optional; product.main_commit already records where the item landed

# One short item per note; an excluded row needs its reason here. Longer write-ups belong in the
# evidence or in LESSONS.md. A single string is still read.
notes: []

# Phase-1 unit fragment: port/phase1/units/<id>.yaml, one unit per file, written on the unit's own
# branch. port/phase1-plan.yaml is generated from the fragments by generate_phase1_plan.py and
# drift-checked (check-phase1-plan.sh), so it is never edited by hand; two branches that add
# different units touch different files and never need a line merge. The plan-wide values and the
# unit order are in port/phase1/_meta.yaml (phase1-meta.template.yaml), which is not a fragment.
# The keys are phase1_drive.py's unit keys, plus an optional `note` the generator drops. See
# references/parallel-phase-1.md.

note: "one-line description of this tooling component"
id: <unit-id>                  # also the evidence folder docs/evidence/phase1/<id>/
layer: 0                       # 0 = the near-serial bootstrap (the harness), proven first; 1 or more = fan-out
kind: harness                  # harness | diff-tool | proof | check | depmap | conventions
depends_on: []                 # unit ids that must be integrated first (producer before consumer)
provides_contract: null        # optional "name@version" a consumer depends on
consumes_contracts: []         # optional ["name@version", ...]; its producer must be integrated first
author_id: null                # Kha-Worker's ses_ id, recorded by Ptah-Orchestrator from the subagent
                               # result (Kha-Worker cannot see it and leaves it null)
reviewer_id: null              # port-review's ses_ id, recorded the same way; must differ from author_id
                               # before mark-proven
reviewed_commit: null          # the work/<id> commit the review covered, recorded with reviewer_id;
                               # integrate_land.sh lands nothing changed after it but this unit's records
# F3 acceptance records, each but readme_row a committed file under docs/evidence/phase1/<id>/.
# harness and diff-tool need inertness; proof, check and depmap need non_vacuity instead; every
# kind needs seeded, source_demo, review and readme_row. `extra_evidence: [key, ...]` adds keys.
evidence:
  seeded: null                 # the detector fires (red, then green)
  source_demo: null            # behaves correctly on the real SOURCE, not only a fixture
  inertness: null              # harness, diff-tool: byte-inert when off
  # non_vacuity: null          # proof, check, depmap (instead of inertness): it exercises its target set
  review: null                 # independent review; verdict clean
  readme_row: false            # the tool's enforcement row set to ENFORCED (true once done)
accepted: false                # set by mark-proven after the independent review is clean
integrated: false              # landed on the workbench by integrate_land.sh (never the product)

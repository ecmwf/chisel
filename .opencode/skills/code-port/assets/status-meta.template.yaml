# TRACE meta: port/status/_meta.yaml, one per port. It is not a work-item fragment: the generator
# and the fragment checks skip it. generate_trace.py copies it verbatim into the generated TRACE's
# `meta:`, so a change here means regenerating TRACE (check-trace-drift.sh). source_root,
# target_root and source_commit are required; the generator stops without them.

source_root: source/
target_root: <the product checkout, as in port/product.yaml>
upstream_commit: <the upstream commit, from port/provenance/<name>.yaml; matches charter section 2>
source_commit: <the local commit that added source/; the anchor verifier reads the SOURCE from it>

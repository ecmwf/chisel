# Claim: port/claims/<trace-id>.yaml, one per work item, reserving it before porting begins.
# provision_worker.sh writes it when it provisions the item's worktree; do not write it by hand.
# The worktree is the write lock, and this file records who holds it, what it covers and its
# state. port/claims/ is local and gitignored. With several operators, the same content can be a
# pushed ref refs/claims/<trace-id>, where push-to-create detects a collision; the tools read it
# with --from-refs (references/team-coordination.md, "Claims: the local lock, atomic").
#
# check_claims.py checks the schema and that the id matches the file or ref name, that no two live
# claims overlap in source or target, and, per branch, that the branch touches only what its claim
# allows. Lists may be written in block or inline form. source, target and paths are optional;
# each item is a clean repo-relative path with no '..'. source and target take no globs; paths may
# use * and ?, which do not cross '/'.

# Equals the file or ref name and the id of port/status/<trace-id>.yaml; it matches
# ^[A-Za-z0-9][A-Za-z0-9_.-]*$.
id: <trace-id>

# Who holds the claim: an agent id or a person's handle.
claimant: <claimant>

# When the claim was made, in UTC. The stale-claim TTL is set in the charter, section 9.
created: <YYYY-MM-DDTHH:MM:SSZ>

# created | active | stale. provision_worker.sh writes active. A stale claim waits for the human
# to triage it; it is never freed automatically.
state: active

# The SOURCE it covers, relative to source_root; two live claims over the same SOURCE are a
# duplicate. provision_worker.sh takes it from the dependency map.
source:
  - <source path>

# The TARGET it will produce, relative to target_root; `paths` replaces it when set.
target:
  - <target path>

# The branch's write surface, relative to the repo root. provision_worker.sh writes the status
# fragment and evidence paths (plus target/ in a single-repo port); left out, it is `target` plus
# port/status/<trace-id>.yaml. With an owned-surface list, a reach into an owned surface the claim
# was not granted is flagged.
paths: []

# Resume handles, written by thread_ledger.py when Ptah-Orchestrator dispatches the item: the
# opencode session ids of its Kha-Worker and its port-review, so a rework or a re-review resumes the
# same session. Each is a ses_ id, never a composed name, and the two are never the same
# (check-threads.sh). Absent until the item is dispatched. See docs/dev/0.5.0-thread-continuity.md.
# threads:
#   worker: ses_<alnum>
#   reviewer: ses_<alnum>

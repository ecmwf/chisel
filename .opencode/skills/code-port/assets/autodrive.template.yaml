# port/autodrive.yaml: the autodrive settings that /port-autodrive reads (and finalize.sh --auto
# reads `level` from). The charter, section 12, explains them; without this file autodrive is off
# (L0). `/port-autodrive enable L1` writes it from this template, or write it by hand. See
# references/auto-mode.md.

schema_version: 1

# L0 off | L1 plan and stop | L2 drive the current phase | L3 drive every phase.
level: L0

# The actions Ptah-Orchestrator may take on its own: claim, work, review, rework, mark-proven,
# integrate. Any other is reported as a recommendation.
# An older config may list mark-gated, the same action as mark-proven (legacy-vocab).
scope: []

budgets:
  max_waves: 0          # 0 = do not run; `enable` sets 30
  max_wall_clock: null  # e.g. "24h" (the `enable` default); null = no limit (set one for L2/L3)
  max_cost: null        # e.g. "50usd"; null = no limit
  max_in_flight: null   # at most this many workers and reviewers at once; null = the whole
                        # ready-set (Layer 0 stays serial)
  max_rework: 10        # a piece that fails review more often than this halts

# TRACE: the row format of port/TRACE.yaml, the source-to-target traceability matrix. Every live
# SOURCE file appears exactly once; an excluded file is listed with status `excluded` and a reason
# (check-completeness.sh). Update it at sprint end (/port-sprint-end).
#
# status: unmapped     - live, not started
#         in-progress  - being ported by <workstream>
#         proven       - an R1+ proof passed and an independent review came back clean, both with
#                        evidence under docs/evidence/ (check-trace-evidence.sh); R0 never proves
#                        a row. proven is a technical status: a milestone is accepted only through
#                        finalize.sh.
#         excluded     - outside the pinned configuration (reason required)
#
# Once status fragments exist (port/status/*.yaml, status-fragment.template.yaml), this file is
# generated from them by tools/coordination/generate_trace.py and drift-checked
# (check-trace-drift.sh); Seshat-Integrator regenerates it, nobody edits it. Generated rows also
# carry `id` and `integration` (proven | integrated: landed on the product mainline). A
# single-operator port edits the file directly at sprint end.

meta:
  source_root: source/
  target_root: "<the product checkout, as in port/product.yaml>"
  upstream_commit: "<the upstream commit, from port/provenance/<name>.yaml; matches charter section 2>"
  source_commit: "<the local commit that added source/; the anchor verifier reads the SOURCE from it>"

files:
  - source: <source path, relative to source_root>
    target: [<target path, relative to target_root>]
    status: unmapped
    workstream: main
    proof: null        # the R1+ proof evidence path under docs/evidence/
    proof_tier: null   # the ladder tier the proof ran (R1+); required once proven
    proof_commit: null # the product commit the proof ran against; required once proven
    validation: null   # "transitive" for a declaration-only unit validated by a consumer's R1; else null
    review: null       # the review report file: docs/evidence/<date>-review-<unit>/report.md
    author_sessions: []      # every session that wrote this translation
    reviewer_session: null   # never one of author_sessions
    tag: null          # the milestone tag that sealed it
    notes: []          # short markers, one per item (a single string is still read)
    # optional, for a file that mixes routine classes (pure / wide-footprint / seam):
    # symbols:
    #   - name: <routine>
    #     class: pure | wide | seam
    #     verification: <unit test path | replay fixture path | ladder tier>
    #     status: unmapped | in-progress | proven
  - source: <excluded source path>
    target: []
    status: excluded
    workstream: null
    proof: null
    tag: null
    notes:
      - not exercised by the pinned configuration (<how determined>)

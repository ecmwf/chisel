# The pinned macro table: copy to tools/scoping/macro-state.yaml (project layer) and list every
# preprocessor macro that guards a dependency edge the extractor
# (tools/coordination/extract_dependencies.py) sees, with its value in the pinned configuration and
# the file that fixes it. A guarded edge whose macro is not listed - also when the table is missing
# or malformed - makes the extraction UNRELIABLE (exit 2): the extractor never guesses whether an
# edge is live.
#
# Shape: a top-level `macro_state:` mapping each NAME (as written in #if/#ifdef) to
#   value:  true if the pinned build defines it, false if not
#   reason: the charter section and file:line that fix it, or a check that no build file defines it
macro_state: {}
# Example:
# macro_state:
#   HAVE_FEATURE_A:
#     value: false
#     reason: "charter section 3: FEATURE_A=OFF; source/CMakeLists.txt:10 `if(HAVE_FEATURE_A) add_definitions(HAVE_FEATURE_A)`"
#   HAVE_FEATURE_B:
#     value: false
#     reason: "no CMakeLists.txt or *.cmake file defines HAVE_FEATURE_B"

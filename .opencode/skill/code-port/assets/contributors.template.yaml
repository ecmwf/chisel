# Contributor registry - the canonical map from contributor ids and sessions to DISTINCT
# humans. Lives at port/contributors.yaml (project-layer). This is the charter/project
# artifact that closes the gap the status-fragment check leaves open.
#
# Why it exists (references/team-coordination.md, "Identity is enforced only syntactically"):
# check-status-fragments.sh enforces only SYNTACTIC independence - reviewer_id != author_id
# and reviewer_session not in author_sessions. That cannot tell ONE human wearing TWO ids
# apart (aliasing), nor catch a reviewer using the author's session (collusion). This registry
# names, per contributor, the underlying HUMAN and the sessions they work in; check-claims'
# sibling check_contributors.py resolves every fragment/claim identity against it and fails if
# author and reviewer turn out to be the same human, or an id/session is unregistered or
# registered to someone else.
#
# Trust boundary (be honest): this defeats ACCIDENTAL aliasing and enforces the distinctness
# the registry DECLARES; it cannot prove the declarations match reality (that one human did
# not register two `human` keys). The registry is human-curated truth, reviewed like any
# protected surface; the detector keeps the fragments consistent WITH it.
#
# Every identity value (id, human, session) must be a non-empty STRING, compared by a
# CANONICAL key - Unicode NFC, trimmed, casefolded - so "Person-Alice" and " person-alice "
# are the SAME human and cannot be split to fake an independent review. Use distinct, canonical
# keys (an org login or a uuid); ids or sessions differing only by case or surrounding space
# are treated as the same (and rejected as duplicates).
# Lists (contributors, sessions) use BLOCK form ("- item"); items are parsed with PyYAML.

schema_version: 1

contributors:
  # One entry per contributor id. The `id` is what appears in a fragment's author_id /
  # reviewer_id and a claim's claimant. The `human` is the stable person key: two ids with
  # the SAME human are the SAME person (so they can never independently review each other).
  - id: <contributor id>
    human: <stable person key - e.g. an org login or person uuid; NOT a display name>
    team: null
    # Every session this contributor works in (a fragment's author_sessions members and its
    # reviewer_session must each appear under exactly ONE contributor - the one using it).
    sessions:
      - <session id>

  - id: <another contributor id>
    human: <a DIFFERENT human, if this is a different person>
    team: null
    sessions:
      - <session id>

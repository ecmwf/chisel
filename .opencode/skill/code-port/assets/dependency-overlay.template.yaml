# tools/scoping/dependency-overlay.yaml - the REVIEWED audit overlay on the dependency map (project-layer).
#
# The line-based extractor (tools/coordination/extract_dependencies.py) is CONSERVATIVE: a construct it
# cannot fully resolve (a continuation-join, a generic interface, an unresolved reference) becomes a
# `coverage-gap:*` or `suspected-coupling` guard that keeps the unit OUT of the self-serve leaf pool.
# Many of those guards are PARSER ARTIFACTS, not real coupling. This overlay is how an operator turns a
# SOURCE AUDIT of such a guard into a GATE-LEGAL input: the extractor APPLIES the committed overlay, so
# check-depmap regenerates `map = extract(SOURCE) + overlay` and a cleared guard is part of the
# generated map, never a hand-edit (which check-depmap rejects). This is what opens the bootstrap pool
# WITHOUT touching the extractor.
#
# FIDELITY RULES (the overlay can never hide real coupling):
#  - It clears ONLY the parser-uncertainty class: `coverage-gap:*` and `suspected-coupling`. It can
#    NEVER clear a STRUCTURAL guard (`shared-surface:*`, `owned-foundation`) - an audit cannot un-share a
#    common block or un-own a foundation; the loader REFUSES such an entry.
#  - Each resolution is an INDEPENDENT-REVIEW decision: the orchestrator audits the SOURCE, records the
#    resolution with its justification, and a DIFFERENT-MODEL reviewer confirms the audit BEFORE it is
#    committed. The overlay is a reviewed artifact, never an agent self-clearing its own guard.
#  - CONTENT-BOUND STALE-FAIL: every resolution carries `source_sha` (the sha256 of the node's SOURCE
#    file at audit time). The extractor recomputes it and fails closed if it differs - so ANY change to
#    the audited file (a node gone, a guard reason gone, OR the same guard now standing for a DIFFERENT
#    real coupling) invalidates the clear. A reviewed clear can never silently outlive the exact source
#    it was audited against. One resolution per node.

schema_version: 1

resolutions:
  # - node: <the map node id whose guard was audited>
  #   clears:                          # the guarded_reasons this audit resolves (parser artifacts only)
  #     - coverage-gap:generic-interface
  #     - suspected-coupling
  #   reason: <why the source audit proves these are NOT real coupling - cite the construct and what it
  #            actually resolves to (e.g. "par_bcast is a generic interface dispatching only to in-tree
  #            procedures already edged; no hidden dependency")>
  #   reviewed_by: <the INDEPENDENT reviewer (a different model) who confirmed the audit>
  #   date: <YYYY-MM-DD>
  #   source_sha: <sha256 of the node's SOURCE file at audit time - `sha256sum <source-file>`; any
  #                change to that file makes this clear STALE and forces a re-audit + re-review>
  []

# SOURCE unit -> the unit that actually translated it.
#
# Most SOURCE units are translated by a unit of the same id, so `yowmap.F90` is translated by
# unit `yowmap` and its review lives at `docs/evidence/phase2/yowmap/review.md`. A few are
# translated by a DIFFERENT unit - the Layer-0 hoists deliberately gather several SOURCE units
# into one coherent deliverable, because their C renderings share a header and are only
# reviewable together.
#
# Without this mapping, `reconcile_trace.sh` looks for a review under the SOURCE unit's own id,
# finds none, and correctly refuses to promote the row - which is what happened to a hoisted unit
# (a SOURCE unit gathered into a Layer-0 hoist, whose review cites that unit's rendered file,
# its dedicated test, and a seeded red/green proof).
#
# DECLARED, not inferred - the same rule as `port/declared-helpers.yaml` and
# `port/declared-tooling.yaml`. An undeclared unit is not exempt from needing its own review;
# it simply has no alias, and the reconciler will refuse it. Adding an entry here does NOT
# assert the review is clean: the verdict is still read from line 1 of the report.

translators: []

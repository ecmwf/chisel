# Dependency map - the SOURCE dependency graph, GENERATED from the SOURCE tree (never
# hand-maintained). Lives at tools/scoping/dependency-map.yaml (project layer); the generic
# extractor that produces it is tools/coordination/extract_dependencies.py, and check-depmap.sh
# fails if this committed file disagrees with what the extractor produces.
#
# Why it exists (references/team-coordination.md, "Owned surfaces vs the leaf pool"): the ready-set
# and the owned/leaf partition are computed from this graph, and the file INVENTORY (one node per
# unit) is check-completeness's independent SOURCE accounting + check-contracts' producer cross-check.
#
# It carries only what a line scan resolves UNAMBIGUOUSLY: the inventory, the PROVEN in-tree use/call
# edges, and the STRUCTURAL surfaces (a module USEd by >= 2 units is an owned foundation; a common
# block shared by >= 2 is a shared surface - both keep a unit out of the self-serve pool). It does
# NOT guess: a reference the line scan cannot resolve in-tree draws NO edge and NO guard. The
# conservatism that used to come from guessing now comes from the real net - a unit wrongly ported in
# isolation fails its R1 DIFFERENTIAL gate or the INDEPENDENT review.

schema_version: 1
source_root: source/

# One node per SOURCE unit/file (id = the file stem, also the work-item id; duplicate stems
# fail the extractor). `role` is owned iff the node provides a surface depended on by >= 2
# other units (a conservative fan-in heuristic; single-dependent contracts - precision, units,
# layout - are promoted to owned surfaces by the charter/contract layer, not by this extractor).
# `self_serve_eligible` is the ready-set gate; `guarded_reasons` says why it is false.
nodes:
  - id: <unit id - the file stem>
    source: <path under source_root>
    role: unowned                 # unowned | owned
    self_serve_eligible: true     # true iff unowned and free of a structural (shared-surface) guard
    guarded_reasons: []           # e.g. owned-foundation, shared-surface:<name>
    coverage: full                # always full (the extractor records only what it resolves)
    provides: []                  # surface names this node defines (e.g. "module:grid_mod")

# Owned surfaces requiring an owner. A module foundation's owner is the node that defines it;
# a shared `common` block has owner null until the charter assigns one (shared mutable state).
owned_surfaces:
  - name: <surface, e.g. "module:grid_mod" or "common:/state/">
    owner: <node id that owns it, or null for shared state the charter must assign>
    dependents: []                # node ids that depend on / participate in this surface

# One edge per PROVEN in-tree dependency (a use/call resolved to an in-tree node).
edges:
  - from: <dependent node id>
    to: <node id>
    confidence: proven            # proven (the only confidence the generated map emits)
    kind: use                     # use | call

# TRACE - source→target traceability matrix.
# Contract: every live SOURCE file appears EXACTLY ONCE; excluded files are listed with
# status `excluded` and a reason. CI checks completeness against the SOURCE tree so no
# file is silently dropped. Update statuses at sprint end (/port-sprint-end).
#
# status: unmapped     - live, not yet started
#         in-progress  - being ported by <workstream>
#         gated        - ported AND acceptance gate passed AND independent fidelity
#                        review clean (gate + review evidence and tag recorded).
#                        The gate field must cite tier R1 or higher: R0 evidence can
#                        never gate an entry. gated is a TECHNICAL status; phase/
#                        milestone acceptance is the human's SIGNOFF.md.
#         excluded     - outside the pinned configuration (reason required)
# `integrated` is NOT a status value but a SEPARATE team-scale field: a generated row
# carries `integration: gated | integrated` (integrated = the gated piece merged into the
# canonical line with integration checks green; never let gated quietly mean "merged").
#
# At team scale this file is GENERATED from per-work-item fragments (port/status/*.yaml,
# template assets/status-fragment.template.yaml) by tools/coordination/generate_trace.py;
# only the integrator/generator writes it and conformance/check-trace-drift.sh guards it
# (see references/team-coordination.md). Generated rows additionally carry `id` (the
# work-item id) and `integration` (the integration.state). The single-operator pilot still
# edits this file directly at sprint end.

meta:
  source_root: source/
  # the ported code is a separate product repo; its checkout path is in port/product.yaml
  target_root: "<product checkout path - see port/product.yaml>"
  # Two distinct commit identities (they differ once the SOURCE is imported and its
  # nested VCS metadata stripped - the upstream commit is no longer in this repo):
  upstream_commit: "<upstream provenance commit - matches charter section 2; for traceability>"
  source_commit: "<LOCAL import commit that introduced the imported tree - what an anchor verifier reads via git show; NOT the upstream hash>"

files:
  - source: <path/relative/to/source_root.F90>
    target: [<path/relative/to/target_root.c>]
    status: unmapped
    workstream: main
    gate: null        # the R1+ gate-evidence PATH, e.g. docs/evidence/<...> (R0 never gates)
    review: null      # fidelity review report: docs/evidence/<date>-review-<module>/
    author_sessions: []   # every sprint that wrote this translation
    reviewer_session: null  # must not appear in author_sessions
    tag: null         # git tag of the milestone that gated it
    notes: ""
    # optional, for files mixing routine classes (pure / wide-footprint / seam):
    # symbols:
    #   - name: <routine>
    #     class: pure | wide | seam
    #     verification: <unit test path | replay fixture path | ladder tier>
    #     status: unmapped | in-progress | gated
  - source: <unused/module.F90>
    target: []
    status: excluded
    workstream: null
    gate: null
    tag: null
    notes: "not exercised by pinned configuration (<how determined>)"

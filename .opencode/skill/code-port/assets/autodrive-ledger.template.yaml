# Autodrive ledger - docs/evidence/autodrive/<run-id>/ledger.yaml. The append-only audit record of
# one auto-run: every decision the orchestrator made, with the planner's rationale, the agent it
# dispatched, the result, and the conformance verdict AFTER the action. Because the planner
# (autodrive.py) is pure, replaying it at each decision's commit reproduces the action the bot took.
# The auto-run integrity gate (conformance/check-autodrive-integrity.sh) checks this file's shape
# and the fail-closed invariant below. See references/auto-mode.md.

schema_version: 1
run_id: <timestamp, e.g. 2026-06-18T14-30-00Z>
level: <L1 | L2 | L3 - must not exceed port/autodrive.yaml level>

# One row per dispatched decision, in order. The ISOLATED actions (claim/work/review/rework) of one
# wave MAY be dispatched CONCURRENTLY (bounded by budgets.max_in_flight); tag those rows with a shared
# `batch_id`. A concurrent batch is ONE planner wave run together, so its rows are contiguous and share
# ONE post-batch conformance verdict. The state-mutating mark-gated/integrate are NEVER batched - they
# run serially through the integrator funnel, each with its own conformance_after.
#
# conformance_after records the suite verdict run AFTER the action (for a batch, the single post-batch
# run). FAIL-CLOSED: it MUST be `green` for every GROUP (a serial action, or a whole batch) except
# possibly the LAST - a run halts on the first red, so a non-green verdict may appear only in the final
# group, immediately before `verdict: halt`. A non-green verdict earlier means the run drove past a
# trust violation, and the gate (check-autodrive-integrity) fails closed.
decisions:
  - at: <iso-8601>
    planned_at_commit: <the workbench HEAD the planner ran against for THIS decision (one wave shares
                        one commit) - so an independent reviewer can replay autodrive.py there and
                        confirm the action was in the plan (references/auto-mode.md "Independently reviewing an auto-run")>
    batch_id: <optional - a string shared by the isolated rows dispatched concurrently in this wave;
               omit for a serial action; mark-gated/integrate must NOT carry one>
    action: <claim | work | review | rework | mark-gated | integrate | advance | halt | done>
    unit: <trace-id, or "-" for advance/halt/done>
    rationale: <the planner's reason, verbatim>
    dispatched: <the agent id/session or the command run, e.g. "kha-worker ses-w1">
    result: <claim ref + OID | fragment commit | review verdict | manifest id | exit code>
    conformance_after: <green | "red: <which check>">

verdict: <done | "halt: <reason>">

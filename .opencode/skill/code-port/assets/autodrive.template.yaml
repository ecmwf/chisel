# port/autodrive.yaml - the MACHINE-READABLE autonomy config for orchestrator auto-mode.
# The charter (port/plan/00-charter.md §12) explains it in prose; THIS file is the structured
# source the auto-run integrity gate (conformance/check-autodrive-integrity.sh) checks against.
# Absent -> auto-mode is not configured (L0); the gate skips. See references/auto-mode.md.
#
# You normally do NOT hand-write this: the toggle scaffolds it for you and verifies it -
#   python3 tools/coordination/enable_autodrive.py --level L1      (or: /port-autodrive enable L1)
# This template is the field reference for editing it afterwards.

schema_version: 1

# L0 off / suggest-only | L1 plan-and-stop | L2 auto within a phase | L3 full auto across phases.
level: L0

# The actions the orchestrator may perform automatically. Any action NOT listed is surfaced as a
# recommendation and pauses the loop (even at L3). Valid: claim, work, review, rework, mark-gated,
# integrate.
scope: []

budgets:
  max_waves: 0          # 0 = do not auto-run; the enable toggle defaults to 30 when turning it on
  max_wall_clock: null  # e.g. "24h" (the enable default); null = unbounded (set one for L2/L3)
  max_cost: null        # e.g. "50usd"; null = unbounded
  max_in_flight: 1      # workers/reviewers dispatched CONCURRENTLY per wave; 1 = serial. A CEILING you
                        # raise per the ramp rule (width earned after clean epochs), never parallel-by-default.
  max_rework: 10        # a piece that churns review more than this many times HALTS

# The registered contributor id the charter-bot signs its BOT_ATTESTATION.md as, at L3. It MUST be
# distinct from every worker/reviewer/integrator identity (it signs; it never authors or reviews),
# and registered in port/contributors.yaml. Required once level is L3; null otherwise. A bot NEVER
# writes the human's SIGNOFF.md - the milestone tag still needs a human countersign.
charter_bot: null

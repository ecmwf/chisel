# Audit manifest - one per integrated deliverable, kept in the workbench
# (port/manifests/<deliverable>.yaml). Binds an exact product commit to the evidence
# that it reproduces the SOURCE. See references/two-repo-architecture.md (C4).
#
# The binding is MACHINE-CHECKABLE, not prose: every artifact is tied to the exact tree
# it concerns by a recomputable hash, so the checker (conformance/check-audit-manifest.sh
# over coordination/check_manifest.py) refuses a manifest that cites evidence produced
# against a DIFFERENT tree. The binding is to the FINAL (squashed) product commit, never
# the pre-squash branch: stale evidence is not evidence.
#
# QUOTE every hash / sha / commit value so YAML keeps it a string: an all-digit hash left
# unquoted would be coerced to an integer and could bypass the binding.

schema_version: 1
deliverable: <coherent unit, e.g. a module and its checks>

product:
  repo: <product repository URL>
  commit: <the squashed product commit this manifest attests>
  tree_hash: <git tree hash of that commit: `git -C $PRODUCT_ROOT rev-parse <commit>^{tree}`>

review:
  reviewed_commit: <the commit an independent review walked against SOURCE>
  reviewed_tree_hash: <tree hash of reviewed_commit - the checker recomputes it from
                       reviewed_commit and requires it equal product.tree_hash, so the
                       review demonstrably saw the attested tree (identical content has an
                       identical git tree hash; there is no separate "equivalence proof")>
  evidence: <workbench path to the review report>
  evidence_sha256: <sha256 of that report>

gate:
  product_commit: <the product commit the gates actually ran against>
  product_tree_hash: <tree hash the gates ran against - MUST equal product.tree_hash;
                      this is what closes the stale-evidence gap>
  tier: <validation-ladder tier(s) run, e.g. R1>
  command: <exact gate invocation, e.g. tools/gates/ci-r1-<subject>.sh>
  exit_code: <recorded exit code (0 = pass)>
  logic_commit: <workbench commit whose gate scripts produced this result, so a later
                 gate change cannot retroactively bless old code>
  evidence: <workbench path to the gate logs / evidence pack>
  evidence_sha256: <sha256 of that evidence>

source:
  pin: <pinned SOURCE commit the work was rendered against>
  subdir: <where SOURCE lives under the workbench, e.g. source/>

reference_run:
  id: <canonical reference run ID from reference/runs.md>
  checksum: <checksum of the reference outputs used for acceptance>

integration:
  state: <gated | integrated>
  epoch_certificate: <integration-epoch certificate, where applicable; else none>

# The workbench commit that already holds the gate/review evidence this manifest cites
# (committed BEFORE this manifest, so it is not self-referential). The pointer FROM the
# product TO its manifest lives in port/product.yaml (attested_commit), updated after
# the manifest is committed.
evidence_commit: <workbench commit sha holding the cited gate/review evidence>

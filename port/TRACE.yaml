# TRACE - the source-to-target traceability matrix. Every live SOURCE file appears exactly once;
# an excluded file is listed with status `excluded` and a reason, and CI checks completeness
# against the SOURCE tree. Update it at sprint end (/port-sprint-end). The row fields and status
# values are described in .opencode/skills/code-port/assets/TRACE.template.yaml. Once status
# fragments exist (port/status/), this file is generated from them by
# tools/coordination/generate_trace.py and never edited by hand.

meta:
  source_root: source/
  # the ported code is a separate product repo; its checkout path is in port/product.yaml
  target_root: "<product checkout path - see port/product.yaml>"
  upstream_commit: null # the upstream commit (port/provenance/<name>.yaml); matches charter §2
  source_commit: null   # the LOCAL commit that added source/ - what the anchor verifier reads

files: []               # populated at Phase 0 from the live-subset determination
